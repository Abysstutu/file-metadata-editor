name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch, tag, or commit to build for this manual run
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.build_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java runtime builder
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python sources
        run: |
          python -m compileall -q app.py metadata_editor
          python -m unittest discover -s tests -q

      - name: Build a dependency-sized Java runtime
        shell: pwsh
        run: |
          $modules = (& jdeps --multi-release 17 --print-module-deps --ignore-missing-deps legacy_helper/legacy-metadata-helper.jar).Trim()
          if (-not $modules) {
            throw "Could not determine the Java modules required by the legacy Office helper."
          }
          Write-Host "Bundling Java modules: $modules"
          jlink --add-modules $modules --strip-debug --no-man-pages --no-header-files --compress=2 --output _build_runtime/runtime
          if (-not (Test-Path "_build_runtime/runtime/bin/java.exe")) {
            throw "Bundled Java runtime was not created."
          }

      - name: Prepare bundled LGPL FFmpeg and ffprobe
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1

      - name: Embed version from release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.build_ref || github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+(?:\.\d+)?)$') {
            "APP_VERSION = '$($Matches[1])'" | Set-Content 'metadata_editor/_release_version.py' -Encoding utf8
          }

      - name: Package fast-start application for the installer
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --workpath build/faststart --distpath dist/faststart --name "文件源数据编辑" --manifest high-dpi.manifest --icon assets/app-icon.ico --add-data "assets/app-icon.png;assets" --add-data "legacy_helper/legacy-metadata-helper.jar;legacy_helper" --add-data "_build_runtime/runtime;runtime" --add-data "_build_runtime/media-tools;media-tools" --collect-all tkinterdnd2 --collect-all pypdf --collect-all PIL --collect-all mutagen --collect-all truststore app.py
          $folderExe = "dist/faststart/文件源数据编辑/文件源数据编辑.exe"
          if (-not (Test-Path $folderExe)) {
            throw "Portable folder executable is missing."
          }
          $tag = "${{ github.event.release.tag_name || inputs.build_ref || github.ref_name }}"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package fast-start installer with desktop shortcut
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup compiler was not found on the Windows runner."
          }
          $tag = "$env:RELEASE_TAG"
          $version = if ($tag -match '^v(.+)$') { $Matches[1] } else { '0.0.0-dev' }
          $source = (Resolve-Path 'dist/faststart/文件源数据编辑').Path
          $output = (Resolve-Path 'dist').Path
          $assetName = "FileMetadataEditor-$tag-Windows-x64-Setup"
          & $compiler "/DAppVersion=$version" "/DSourceDir=$source" "/O$output" "/F$assetName" 'installer/file-metadata-editor.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed."
          }
          $setupAsset = "dist/$assetName.exe"
          if (-not (Test-Path $setupAsset)) {
            throw "Installer is missing: $setupAsset"
          }
          "SETUP_ASSET=$setupAsset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test fast-start and installed launch modes
        shell: pwsh
        run: |
          $folderMedia = Start-Process -FilePath "dist/faststart/文件源数据编辑/文件源数据编辑.exe" -ArgumentList '--self-test-media' -Wait -PassThru
          if ($folderMedia.ExitCode -ne 0) {
            throw "Bundled FFmpeg/ffprobe failed in the portable folder."
          }

          $folderWatch = [System.Diagnostics.Stopwatch]::StartNew()
          $folder = Start-Process -FilePath "dist/faststart/文件源数据编辑/文件源数据编辑.exe" -PassThru
          Start-Sleep -Seconds 5
          $folder.Refresh()
          if ($folder.HasExited) {
            throw "The fast-start portable-folder application exited during startup."
          }
          Write-Host "Portable-folder process survived startup check in $($folderWatch.Elapsed.TotalSeconds) seconds."
          Stop-Process -Id $folder.Id -Force

          $setup = Start-Process -FilePath "$env:SETUP_ASSET" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Installer failed: exit $($setup.ExitCode)"
          }
          $installedExe = "$env:LOCALAPPDATA\Programs\FileMetadataEditor\文件源数据编辑.exe"
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) '文件源数据编辑.lnk'
          if (-not (Test-Path $installedExe) -or -not (Test-Path $desktopLink)) {
            throw "Installed application or desktop shortcut is missing."
          }
          $installedMedia = Start-Process -FilePath $installedExe -ArgumentList '--self-test-media' -Wait -PassThru
          if ($installedMedia.ExitCode -ne 0) {
            throw "Installed application could not run its bundled media tools."
          }
          $uninstall = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\FileMetadataEditor\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Installer uninstall smoke test failed."
          }
          if (Test-Path $desktopLink) {
            throw "Desktop shortcut remained after uninstall."
          }

      - name: Create or update the GitHub Release
        if: github.event_name == 'push' || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:RELEASE_TAG"
          $null = gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "$env:SETUP_ASSET" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$tag" "$env:SETUP_ASSET" --repo "$env:GITHUB_REPOSITORY" --title "$tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update release $tag."
          }

      - name: Update the public update manifest
        if: github.event_name == 'push' || github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $asset = Get-Item "$env:SETUP_ASSET"
          $digest = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            tag_name = $tag
            html_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            assets = @([ordered]@{
              name = $asset.Name
              browser_download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($asset.Name)"
              size = $asset.Length
              digest = "sha256:$digest"
            })
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main for the update manifest." }
          git switch -C publish-update-manifest origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not switch to main for the update manifest." }
          if (Test-Path 'updates/latest.json') {
            $previous = Get-Content 'updates/latest.json' -Raw | ConvertFrom-Json
            if ([version]($previous.tag_name -replace '^v', '') -gt [version]($tag -replace '^v', '')) {
              Write-Host "A newer release is already listed in the update manifest."
              return
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content 'updates/latest.json' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { return }
          git commit -m "Point update checker to $tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the update manifest." }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the update manifest." }

      - name: Save manual build outputs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FileMetadataEditor-${{ inputs.build_ref }}-Windows-x64
          path: |
            ${{ env.SETUP_ASSET }}
          if-no-files-found: error
          retention-days: 14
