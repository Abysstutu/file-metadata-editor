name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch, tag, or commit to build for this manual run
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.build_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java runtime builder
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python sources
        run: |
          python -m compileall -q app.py metadata_editor
          python -m unittest discover -s tests -q

      - name: Build a dependency-sized Java runtime
        shell: pwsh
        run: |
          $modules = (& jdeps --multi-release 17 --print-module-deps --ignore-missing-deps legacy_helper/legacy-metadata-helper.jar).Trim()
          if (-not $modules) {
            throw "Could not determine the Java modules required by the legacy Office helper."
          }
          Write-Host "Bundling Java modules: $modules"
          jlink --add-modules $modules --strip-debug --no-man-pages --no-header-files --compress=2 --output _build_runtime/runtime
          if (-not (Test-Path "_build_runtime/runtime/bin/java.exe")) {
            throw "Bundled Java runtime was not created."
          }

      - name: Prepare bundled LGPL FFmpeg and ffprobe
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1

      - name: Package compact single-file executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "文件源数据编辑" --manifest high-dpi.manifest --icon assets/app-icon.ico --add-data "assets/app-icon.png;assets" --add-data "legacy_helper/legacy-metadata-helper.jar;legacy_helper" --add-data "_build_runtime/runtime;runtime" --add-data "_build_runtime/media-tools;media-tools" --collect-all tkinterdnd2 --collect-all pypdf --collect-all PIL --collect-all mutagen app.py
          $tag = "${{ github.event.release.tag_name || inputs.build_ref || github.ref_name }}"
          $asset = "dist/FileMetadataEditor-$tag-Windows-x64.exe"
          Move-Item "dist/文件源数据编辑.exe" $asset
          if (-not (Test-Path $asset)) {
            throw "Packaged executable is missing: $asset"
          }
          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package faster-start portable folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --workpath build/faststart --distpath dist/faststart --name "文件源数据编辑" --manifest high-dpi.manifest --icon assets/app-icon.ico --add-data "assets/app-icon.png;assets" --add-data "legacy_helper/legacy-metadata-helper.jar;legacy_helper" --add-data "_build_runtime/runtime;runtime" --add-data "_build_runtime/media-tools;media-tools" --collect-all tkinterdnd2 --collect-all pypdf --collect-all PIL --collect-all mutagen app.py
          $folderExe = "dist/faststart/文件源数据编辑/文件源数据编辑.exe"
          if (-not (Test-Path $folderExe)) {
            throw "Portable folder executable is missing."
          }
          $tag = "${{ github.event.release.tag_name || inputs.build_ref || github.ref_name }}"
          $fastAsset = "dist/FileMetadataEditor-$tag-Windows-x64-FastStart.zip"
          Compress-Archive -Path "dist/faststart/文件源数据编辑/*" -DestinationPath $fastAsset -CompressionLevel Fastest
          if (-not (Test-Path $fastAsset)) {
            throw "Fast-start portable archive is missing."
          }
          "FAST_ASSET=$fastAsset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package fast-start installer with desktop shortcut
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup compiler was not found on the Windows runner."
          }
          $tag = "$env:RELEASE_TAG"
          $version = if ($tag -match '^v(.+)$') { $Matches[1] } else { '0.0.0-dev' }
          $source = (Resolve-Path 'dist/faststart/文件源数据编辑').Path
          $output = (Resolve-Path 'dist').Path
          $assetName = "FileMetadataEditor-$tag-Windows-x64-Setup"
          & $compiler "/DAppVersion=$version" "/DSourceDir=$source" "/O$output" "/F$assetName" 'installer/file-metadata-editor.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed."
          }
          $setupAsset = "dist/$assetName.exe"
          if (-not (Test-Path $setupAsset)) {
            throw "Installer is missing: $setupAsset"
          }
          "SETUP_ASSET=$setupAsset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test portable and installed launch modes
        shell: pwsh
        run: |
          $onefileMedia = Start-Process -FilePath "$env:RELEASE_ASSET" -ArgumentList '--self-test-media' -Wait -PassThru
          if ($onefileMedia.ExitCode -ne 0) {
            throw "Bundled FFmpeg/ffprobe failed in the single-file application."
          }
          $folderMedia = Start-Process -FilePath "dist/faststart/文件源数据编辑/文件源数据编辑.exe" -ArgumentList '--self-test-media' -Wait -PassThru
          if ($folderMedia.ExitCode -ne 0) {
            throw "Bundled FFmpeg/ffprobe failed in the portable folder."
          }

          $onefileWatch = [System.Diagnostics.Stopwatch]::StartNew()
          $onefile = Start-Process -FilePath "$env:RELEASE_ASSET" -PassThru
          Start-Sleep -Seconds 15
          $onefile.Refresh()
          if ($onefile.HasExited) {
            throw "The single-file application exited during startup."
          }
          Write-Host "Single-file process survived startup check in $($onefileWatch.Elapsed.TotalSeconds) seconds."
          Stop-Process -Id $onefile.Id -Force

          $folderWatch = [System.Diagnostics.Stopwatch]::StartNew()
          $folder = Start-Process -FilePath "dist/faststart/文件源数据编辑/文件源数据编辑.exe" -PassThru
          Start-Sleep -Seconds 5
          $folder.Refresh()
          if ($folder.HasExited) {
            throw "The fast-start portable-folder application exited during startup."
          }
          Write-Host "Portable-folder process survived startup check in $($folderWatch.Elapsed.TotalSeconds) seconds."
          Stop-Process -Id $folder.Id -Force

          $setup = Start-Process -FilePath "$env:SETUP_ASSET" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Installer failed: exit $($setup.ExitCode)"
          }
          $installedExe = "$env:LOCALAPPDATA\Programs\FileMetadataEditor\文件源数据编辑.exe"
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) '文件源数据编辑.lnk'
          if (-not (Test-Path $installedExe) -or -not (Test-Path $desktopLink)) {
            throw "Installed application or desktop shortcut is missing."
          }
          $installedMedia = Start-Process -FilePath $installedExe -ArgumentList '--self-test-media' -Wait -PassThru
          if ($installedMedia.ExitCode -ne 0) {
            throw "Installed application could not run its bundled media tools."
          }
          $uninstall = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\FileMetadataEditor\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Installer uninstall smoke test failed."
          }
          if (Test-Path $desktopLink) {
            throw "Desktop shortcut remained after uninstall."
          }

      - name: Create or update the GitHub Release
        if: github.event_name == 'push' || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:RELEASE_TAG"
          $null = gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "$env:RELEASE_ASSET" "$env:FAST_ASSET" "$env:SETUP_ASSET" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$tag" "$env:RELEASE_ASSET" "$env:FAST_ASSET" "$env:SETUP_ASSET" --repo "$env:GITHUB_REPOSITORY" --title "$tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update release $tag."
          }

      - name: Save manual build outputs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FileMetadataEditor-${{ inputs.build_ref }}-Windows-x64
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.FAST_ASSET }}
            ${{ env.SETUP_ASSET }}
          if-no-files-found: error
          retention-days: 14
